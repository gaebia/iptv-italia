name: Aggiorna IPTV Italia

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

  push:
    paths:
      - "scripts/build.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Genera playlist ed EPG
        run: |
          python scripts/build.py

      - name: Controlla file generati
        run: |
          test -s playlist_italia.m3u8
          test -s epg_italia.xml

      - name: Salva playlist ed EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist_italia.m3u8 epg_italia.xml

          git diff --cached --quiet || git commit -m "Aggiorna playlist ed EPG"

          git push
