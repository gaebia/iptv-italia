name: Aggiorna IPTV Italia

on:
  workflow_dispatch:

  schedule:
    - cron: "15 3 * * *"

  push:
    paths:
      - "scripts/build.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Genera playlist italiana
        run: |
          python scripts/build.py

      - name: Commit playlist aggiornata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist_italia.m3u8

          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Aggiornamento playlist Italia"
            git push
          fi
